name: Build & Release Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build, Smoke Test & Release Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller flake8 bandit pip-audit

      - name: Lint Syntax & Undefined Names (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security Scan - Code (Bandit)
        run: |
          bandit -r app/ -ll -ii -x app/static

      - name: Security Scan - Dependencies (pip-audit)
        run: |
          pip-audit -r requirements.txt --desc on

      - name: Run Pytest Suite
        run: |
          python -m pytest -v --tb=short

      - name: Build Standalone Windows Executable with PyInstaller
        run: |
          pyinstaller --clean SOC_Alert_Analyzer.spec

      - name: Smoke Test Standalone Executable (--help)
        run: |
          .\dist\SOC_Alert_Analyzer.exe --help

      - name: Generate SHA-256 Release Checksum
        run: |
          python -c "import hashlib; h = hashlib.sha256(open('dist/SOC_Alert_Analyzer.exe', 'rb').read()).hexdigest(); open('dist/SHA256SUMS.txt', 'w').write(f'{h}  SOC_Alert_Analyzer.exe\n'); print(f'Generated SHA-256: {h}')"

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOC_Alert_Analyzer_windows_x64
          path: |
            dist/SOC_Alert_Analyzer.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SOC Alert Analyzer ${{ github.ref_name }} - Hardened Standalone Release"
          draft: false
          prerelease: false
          files: |
            dist/SOC_Alert_Analyzer.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
