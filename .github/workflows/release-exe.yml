name: Build & Release Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build, Smoke Test & Release Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install "pyinstaller==6.22.2" flake8 bandit pip-audit pytest-cov

      - name: Lint Syntax & Undefined Names (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security Scan - Code (Bandit)
        run: |
          bandit -r app/ -ll -ii -x app/static

      - name: Security Scan - Dependencies (pip-audit)
        run: |
          pip-audit -r requirements.txt --desc on

      - name: Run Pytest Suite with Coverage Gate
        run: |
          python -m pytest -v --tb=short --cov=app --cov-fail-under=85

      - name: Run Empirical Detection Evaluation Benchmark
        run: |
          python scripts/evaluate_detection.py

      - name: Run Realistic Endpoint Telemetry Benchmark
        run: |
          python scripts/evaluate_endpoint_attacks.py

      - name: Build Standalone Windows Executable with PyInstaller
        run: |
          pyinstaller --clean SOC_Alert_Analyzer.spec

      - name: Smoke Test Standalone Executable (--help)
        run: |
          .\dist\SOC_Alert_Analyzer.exe --help

      - name: Run Executable Process Lifecycle Integration Test Across Restarts
        run: |
          python scripts/test_exe_lifecycle_integration.py --exe dist/SOC_Alert_Analyzer.exe

      - name: Run Executable WebSocket Handshake, Live Alert Delivery & Security Integration Test Suite (Tests A-M)
        run: |
          python scripts/test_exe_websocket_integration.py --exe dist/SOC_Alert_Analyzer.exe

      - name: Verify Packaged Resources & Live HTTP API Smoke Test
        shell: powershell
        run: |
          # 1. Verify executable size and existence
          if (!(Test-Path "dist\SOC_Alert_Analyzer.exe")) {
            throw "Executable dist\SOC_Alert_Analyzer.exe not found!"
          }
          $exeSize = (Get-Item "dist\SOC_Alert_Analyzer.exe").Length
          if ($exeSize -lt 20000000) {
            throw "Executable size is abnormally small ($exeSize bytes), resources may be missing."
          }
          Write-Host "Packaged executable verified ($exeSize bytes)."

          # 2. Launch in background for HTTP API smoke test
          $proc = Start-Process .\dist\SOC_Alert_Analyzer.exe -ArgumentList '--port 8011 --no-browser' -PassThru
          $connected = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:8011/api/v1/auth/me" -TimeoutSec 2
                $connected = $true
                Write-Host "Live Executable Health Check: SUCCESS (initialized in $($i+1)s)"
                Write-Host ($resp | ConvertTo-Json)
                break
              } catch {
                # Still initializing
              }
            }
            if (-not $connected) {
              throw "Executable failed to start and respond on port 8011 within 30 seconds."
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Generate and Verify SHA-256 Release Checksum
        run: |
          python scripts/verify_release_checksum.py --generate dist/SOC_Alert_Analyzer.exe dist/SHA256SUMS.txt

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOC_Alert_Analyzer_windows_x64
          path: |
            dist/SOC_Alert_Analyzer.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SOC Alert Analyzer ${{ github.ref_name }} - Hardened Standalone Release"
          draft: false
          prerelease: false
          files: |
            dist/SOC_Alert_Analyzer.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
