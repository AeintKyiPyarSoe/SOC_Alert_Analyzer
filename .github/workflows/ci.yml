name: CI/CD Pipeline - Test, Quality & Security Audit

on:
  push:
    branches: [ "main", "master", "improvement/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pytest Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-cov

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest -v --tb=short --ignore=tests/test_browser_monitoring_ui.py --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Run Empirical Detection Evaluation Benchmark
        run: |
          python scripts/evaluate_detection.py

      - name: Run Realistic Endpoint Telemetry Benchmark
        run: |
          python scripts/evaluate_endpoint_attacks.py

  security-and-lint:
    name: Code Quality & Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Audit and Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install flake8 ruff pip-audit bandit

      - name: Python Syntax and Fatal Error Linting (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: High-Performance Static Code Analysis (ruff)
        run: |
          ruff check --select=E9,F63,F7,F82 app/ tests/ launcher.py scripts/

      - name: Dependency Security Audit (pip-audit)
        run: |
          pip-audit -r requirements.lock --desc on

      - name: Static AST Application Security Analysis (bandit)
        run: |
          bandit -r app/ -ll -ii -x app/static

  browser-e2e:
    name: Playwright Chromium Browser Automation Suite (Scenarios 1-10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & Headless Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install "playwright==1.50.0"
          python -m playwright install --with-deps chromium

      - name: Execute Mandatory Real Browser Monitoring Scenarios (Scenarios 1-10)
        run: |
          python -m pytest tests/test_browser_monitoring_ui.py -v --tb=short

      - name: Upload Browser Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
