services:
  db:
    image: postgres:15-alpine
    container_name: soc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_dev_local_only_insecure_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-soc_alert_db}
    # Security: Restrict direct database exposure to host. Database is only accessible
    # on the internal Docker network. Uncomment 127.0.0.1:5432 only for local debugging.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_user} -d ${POSTGRES_DB:-soc_alert_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - soc_internal_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc_web_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_dev_local_only_insecure_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-soc_alert_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # Security: If not specified in .env, development mode auto-generates unique instance keys.
      # In production mode (ENVIRONMENT=production), non-default 32+ character keys are strictly enforced.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ANALYST_API_KEY: ${ANALYST_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      CORRELATION_WINDOW_SECONDS: ${CORRELATION_WINDOW_SECONDS:-300}
      DEDUP_WINDOW_SECONDS: ${DEDUP_WINDOW_SECONDS:-300}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_INSECURE_AUTH_DISABLED: ${ALLOW_INSECURE_AUTH_DISABLED:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DATA_DIR: ${DATA_DIR:-/app/data}
    ports:
      # Security: Default to loopback publishing (127.0.0.1) to prevent unintended LAN exposure.
      # Expose externally (e.g. "8000:8000") only behind an authenticated reverse proxy or TLS terminating gateway.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./sample_alerts:/app/sample_alerts:ro
      - ./sample_data:/app/sample_data:ro
      - soc_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/stream/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - soc_internal_net

networks:
  soc_internal_net:
    driver: bridge

volumes:
  postgres_data:
  soc_data:
