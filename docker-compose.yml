services:
  db:
    image: postgres:15-alpine
    container_name: soc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: soc_user
      POSTGRES_PASSWORD: soc_secure_password
      POSTGRES_DB: soc_alert_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_user -d soc_alert_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: soc_web_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://soc_user:soc_secure_password@db:5432/soc_alert_db
      CORRELATION_WINDOW_SECONDS: 300
    ports:
      - "8000:8000"
    volumes:
      - ./sample_data:/app/sample_data

volumes:
  postgres_data:
